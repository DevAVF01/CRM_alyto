version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: crm_alyto_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      # Sin valores de relleno: con credenciales inventadas el backend arrancaria "configurado"
      # y fallaria request a request. Si faltan y tampoco hay DEMO_MODE, el contenedor no levanta.
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - DEMO_MODE=${DEMO_MODE:-}
      - AUTH_SECRET=${AUTH_SECRET:-}
      - DEMO_PASSWORD=${DEMO_PASSWORD:-}
      - STELLAR_NETWORK=TESTNET
      - STELLAR_HORIZON_URL=https://horizon-testnet.stellar.org
      - SENTRY_DSN=${SENTRY_DSN:-}
    networks:
      - crm_network

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: crm_alyto_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - crm_network

networks:
  crm_network:
    driver: bridge
